name: "PR \u2014 Quality Gates"

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - name: Unit tests
        run: pnpm test:run

  mutation-tests:
    runs-on: ubuntu-latest
    # Stryker only mutates the data layer (see stryker.config.json), so it can
    # only find anything new when src/data/** (or its Stryker/Vitest config)
    # changes. The job always runs and reports — safe as a required check — but
    # the ~7-minute Stryker run is gated behind a path filter so the vast
    # majority of PRs skip it in seconds.
    steps:
      - uses: actions/checkout@v4
      - name: Detect data-layer changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            data:
              - 'src/data/**'
              - 'stryker.config.json'
              - 'vite.config.ts'
      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.data == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.data == 'true'
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.data == 'true'
        env:
          HUSKY: "0"
      - name: Mutation tests (Stryker)
        if: steps.filter.outputs.data == 'true'
        run: pnpm test:mutate
      - name: Skip notice
        if: steps.filter.outputs.data != 'true'
        run: echo "No src/data changes — skipping mutation tests."

  e2e-tests:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image so Chromium is pre-installed and we
    # never hit the `playwright install` browser download, which intermittently
    # stalls after reaching 100% against cdn.playwright.dev and hangs the job.
    # Keep this tag in lockstep with the @playwright/test version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: E2E tests
        run: pnpm test:e2e:emulator
